name: AMH113 Final Audit + APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake autopoint libtool libltdl-dev libffi-dev libssl-dev pkg-config zlib1g-dev libncurses-dev libncursesw5-dev libtinfo6 lld llvm cmake gettext build-essential

      - name: Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0"
          python -m pip install "cython==0.29.34"

      - name: Static audit
        run: |
          python tests.py
          python -m compileall -q main.py engine.py screen_reader.py tests.py

      - name: Clean Android cache
        run: rm -rf .buildozer bin __pycache__

      - name: Build debug APK
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;25.1.8937393"

          mkdir -p "$HOME/.buildozer/android/platform"
          # Buildozer defaults to this SDK location; point it at the fully provisioned runner SDK.
          ln -sfn "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"
          export ANDROIDSDK="$ANDROID_HOME"
          # Buildozer 1.6 still looks for the legacy SDK tools/bin/sdkmanager path.\n          # Point that legacy path at the current cmdline-tools sdkmanager.\n          mkdir -p "$ANDROID_HOME/tools/bin"\n          ln -sfn "$SDKMANAGER" "$ANDROID_HOME/tools/bin/sdkmanager"\n          test -x "$ANDROID_HOME/tools/bin/sdkmanager"\n          rm -rf "$HOME/.buildozer/android/platform/android-ndk-r25b"
          ln -s "$ANDROID_HOME/ndk/25.1.8937393" "$HOME/.buildozer/android/platform/android-ndk-r25b"

          NDK="$HOME/.buildozer/android/platform/android-ndk-r25b"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$LLVM/aarch64-linux-android24-clang"
          test -x "$LLVM/aarch64-linux-android24-clang++"
          test -x "$LLVM/ld.lld"

          # Keep NDK paths available, but DO NOT export Android target compilers globally.
          # Buildozer/python-for-android must compile hostpython3 with the Ubuntu host compiler
          # and select the Android LLVM compiler only for the Android target.
          export ANDROID_NDK="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"
          export ANDROIDNDK="$NDK"
          # Do not prepend the Android LLVM bin directory to PATH.\n          # python-for-android selects target compilers itself.\n\n          unset CC CXX LD AR RANLIB STRIP

          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "CC=${CC:-<host-default>}"
          echo "CXX=${CXX:-<host-default>}"
          echo "LD=${LD:-<host-default>}"
          buildozer -v android debug 2>&1 | tee build.log

      - name: Dump compiler diagnostics on failure
        if: failure()
        run: |
          echo "===== Python cross-compile config.log diagnostics ====="
          find .buildozer -type f -name config.log -print0 | while IFS= read -r -d '' f; do
            echo "===== $f ====="
            grep -n -A35 -B25 -E "checking whether the C compiler works|C compiler cannot create executables|conftest|ld\.lld|clang" "$f" | tail -n 220 || true
          done
          echo "===== Last build.log compiler/linker lines ====="
          grep -n -E "clang|ld\.lld|cannot create executables|C compiler|error:" build.log | tail -n 220 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMH113-FINAL-APK
          path: |
            bin/*.apk
            bin/**/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMH113-FINAL-build-log
          path: build.log
          if-no-files-found: warn
